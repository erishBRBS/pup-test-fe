<div class="min-h-screen bg-slate-100 p-6">
  <div class="mx-auto max-w-5xl">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">
          User Management
        </h1>
        <p class="text-sm text-slate-500">
          Welcome, {{ user?.firstName }} {{ user?.lastName }}
        </p>
      </div>

      <p-button
        label="Logout"
        icon="pi pi-sign-out"
        severity="secondary"
        (onClick)="logout()"
      ></p-button>
    </div>

    <p-card>
      <p class="text-slate-700">
        Hello World! This card is for user management table and other related features. You can add, edit, or delete users from this page.
      </p>
    </p-card>
  </div>
</div>
