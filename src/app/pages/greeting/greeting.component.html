<p-toast [life]="3000"></p-toast>

<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <p-card styleClass="w-full max-w-md text-center shadow-lg rounded-2xl">
    <ng-container *ngIf="currentView === 'welcome'">
      <h1 class="text-3xl font-bold text-slate-900">
        Hello! {{ displayName }}
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        You are logged in as User.
      </p>

      <div class="mt-6 flex justify-center gap-2">
        <p-button
          label="Profile"
          icon="pi pi-user"
          severity="info"
          (onClick)="showProfile()"
        ></p-button>

        <p-button
          label="Logout"
          icon="pi pi-sign-out"
          severity="secondary"
          (onClick)="logout()"
        ></p-button>
      </div>
    </ng-container>

    <ng-container *ngIf="currentView === 'profile'">
      <div class="mb-4 text-left">
        <h2 class="text-2xl font-bold text-slate-900">
          Profile
        </h2>

        <p class="text-sm text-slate-500">
          View and update your account details.
        </p>
      </div>

      <ng-container *ngIf="!editMode">
        <div class="space-y-3 text-left">
          <div class="rounded-lg bg-slate-100 p-3">
            <p class="text-xs text-slate-500">First Name</p>
            <p class="font-medium text-slate-900">
              {{ user?.firstName }}
            </p>
          </div>

          <div class="rounded-lg bg-slate-100 p-3">
            <p class="text-xs text-slate-500">Last Name</p>
            <p class="font-medium text-slate-900">
              {{ user?.lastName }}
            </p>
          </div>
        </div>

        <div class="mt-6 flex justify-center gap-2">
          <p-button
            label="Back"
            icon="pi pi-arrow-left"
            severity="secondary"
            (onClick)="backToWelcome()"
          ></p-button>

          <p-button
            label="Edit"
            icon="pi pi-pencil"
            (onClick)="editProfile()"
          ></p-button>
        </div>
      </ng-container>

      <ng-container *ngIf="editMode">
        <form [formGroup]="form" class="space-y-4 text-left">
          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              First Name
            </label>

            <input
              pInputText
              class="w-full"
              formControlName="firstName"
              placeholder="Enter first name"
            />

            <small
              *ngIf="form.get('firstName')?.invalid && form.get('firstName')?.touched"
              class="text-red-500"
            >
              First name is required.
            </small>
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Last Name
            </label>

            <input
              pInputText
              class="w-full"
              formControlName="lastName"
              placeholder="Enter last name"
            />

            <small
              *ngIf="form.get('lastName')?.invalid && form.get('lastName')?.touched"
              class="text-red-500"
            >
              Last name is required.
            </small>
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-700">
              Username
            </label>

            <input
              pInputText
              class="w-full"
              formControlName="username"
              placeholder="Enter username"
            />

            <small
              *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
              class="text-red-500"
            >
              Username is required.
            </small>
          </div>
        </form>

        <div class="mt-6 flex justify-center gap-2">
          <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            [disabled]="saving"
            (onClick)="cancelEdit()"
          ></p-button>

          <p-button
            label="Save"
            icon="pi pi-save"
            [loading]="saving"
            (onClick)="saveProfile()"
          ></p-button>
        </div>
      </ng-container>
    </ng-container>
  </p-card>
</div>
